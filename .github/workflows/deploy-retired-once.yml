# One-off publish of the retired page. This file is the only push trigger,
# and it is removed after the page is live. It does not build markets,
# call a model, or enable a schedule.

name: Deploy retired page once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-retired-once.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the retired page
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Stage the retired page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          test -s _site/index.html
          if grep -E -q 'q-price|talking_points\.json' _site/index.html; then
            echo "Refusing to publish a page that still looks like the market briefing."
            exit 1
          fi
          if ! grep -q 'noindex' _site/index.html; then
            echo "Refusing to publish without noindex."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
